<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">CogniOS workflow</title><desc id="desc">The desktop frontend communicates with a local CogniWork runtime that plans tasks, selects configured model providers and tools, and returns results for review.</desc><rect width="1200" height="400" rx="18" fill="#F1F3F0"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#6C8044">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#2B332A">CogniOS</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6B7569">Local-first desktop intent to completed work</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#D8DED3"/><path d="M 300 237 L 330 237" stroke="#6B7569" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#6B7569" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#6B7569" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#6B7569" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#6B7569" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#6B7569" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D8DED3" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#6C8044"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#6C8044">01 / DESKTOP</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2B332A">React + Tauri</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B7569">Collect user intent in the desktop UI.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D8DED3" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#8AAECF"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#8AAECF">02 / COGNIWORK</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2B332A">Plan the task</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B7569">Select tools and execution steps.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D8DED3" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#C39A57"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#C39A57">03 / RUNTIME</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2B332A">Models + connectors</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B7569">Run approved tools and local workflows.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D8DED3" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#6C8044"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#6C8044">04 / RESULT</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2B332A">Review the artefact</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B7569">Return files, actions, or task output.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#6C8044">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B7569">Local-first design still requires careful permissions when connected services or external model providers are enabled.</text></svg>