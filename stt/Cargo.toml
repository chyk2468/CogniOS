[package]
name = "ocw-stt"
version = "0.1.0"
description = "Local, offline speech-to-text engine for CogniOS hosts"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[dependencies]
cpal = "0.15.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", features = ["json"] }
